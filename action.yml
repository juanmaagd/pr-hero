name: 'pr-hero'
description: 'Multi-agent AI code review engine with adversarial refutation and assistant posture'
author: 'juanmaagd'
branding:
  icon: 'eye'
  color: 'purple'

inputs:
  github-token:
    description: 'GitHub token used for PR comments and API access'
    required: false
    default: '${{ github.token }}'
  anthropic-api-key:
    description: 'Anthropic API key for Claude models. Omit if claude-token is supplied.'
    required: false
  claude-token:
    description: 'Claude Code OAuth token. Omit if anthropic-api-key is supplied.'
    required: false
  pr-number:
    description: 'Pull request number. Defaults to the triggering pull_request/issue_comment event.'
    required: false
  model:
    description: 'Optional Claude model override for every agent'
    required: false
  scout:
    description: 'Run the experimental diff-only scout stage before hunting'
    required: false
    default: 'false'
  max-changed-lines:
    description: 'Size gate: skip the review when the diff exceeds this many changed lines. 0 disables the limit.'
    required: false
    default: '1000'
  max-changed-files:
    description: 'Size gate: skip the review when the diff exceeds this many changed files. 0 disables the limit.'
    required: false
    default: '50'
  budget-usd:
    description: 'Spend gate: skip the review when its estimated cost exceeds this USD ceiling. Leave unset to resolve the ceiling from the route billing mode - no ceiling on a Claude subscription (a run draws on quota, not a per-token invoice), a default ceiling on a metered ANTHROPIC_API_KEY route. An explicit value is honoured on any route; a value <= 0 disables the ceiling (still gated by the size limits above).'
    required: false
    default: ''
  post:
    description: 'Publish findings as inline PR comments and a review'
    required: false
    default: 'true'
  step-summary:
    description: 'Write a Markdown summary to the job step summary'
    required: false
    default: 'true'

outputs:
  status:
    description: 'Review outcome: reviewed, skipped-size, skipped-budget, or error'
    value: ${{ steps.run-pr-hero.outputs.status }}
  findings-count:
    description: 'Total number of verified findings'
    value: ${{ steps.run-pr-hero.outputs.findings_count }}
  blocking-count:
    description: 'Total number of blocking-tier findings'
    value: ${{ steps.run-pr-hero.outputs.blocking_count }}
  advisory-count:
    description: 'Total number of advisory-tier findings'
    value: ${{ steps.run-pr-hero.outputs.advisory_count }}
  cost-usd-est:
    description: 'Estimated cost of the review, in USD'
    value: ${{ steps.run-pr-hero.outputs.cost_usd_est }}
  run-dir:
    description: 'Path to the run directory containing findings.json and report.md'
    value: ${{ steps.run-pr-hero.outputs.run_dir }}

# No `runs-on` here on purpose: a composite action runs on whatever runner
# the CALLING workflow's job selects (spec 1.1 requires ubuntu-latest AND
# macos-latest support). Every step below is plain POSIX shell with no
# OS-specific flags, so both runners are supported without a matrix here.
runs:
  using: 'composite'
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        # Pinned, not `latest`: a published Action's toolchain should be
        # reproducible run to run, not a moving target. Matches this repo's
        # own engines constraint (package.json: "bun": ">=1.3.0") and the
        # version this repo is developed and tested against.
        bun-version: '1.3.14'

    - name: Install dependencies
      shell: bash
      run: |
        if [ -f "${{ github.action_path }}/package.json" ]; then
          cd "${{ github.action_path }}" && bun install --frozen-lockfile
        fi

    - name: Install Claude Code CLI
      shell: bash
      run: |
        if ! command -v claude >/dev/null 2>&1; then
          npm install -g @anthropic-ai/claude-code
        fi

    - name: Run pr-hero
      id: run-pr-hero
      shell: bash
      env:
        # Every `${{ inputs.* }}` / `${{ github.* }}` value pr-hero needs is
        # bound here, through `env:`, and referenced below as a QUOTED shell
        # variable — never interpolated directly into the script body. A
        # free-text input (model, in particular) is attacker-influenceable
        # on a `pull_request_target`-triggered workflow; splicing it
        # straight into the script would be a command-injection hole.
        GITHUB_TOKEN: ${{ inputs.github-token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-token }}
        GITHUB_ACTIONS: 'true'
        CI: 'true'
        NO_COLOR: '1'
        PR_NUMBER_INPUT: ${{ inputs.pr-number }}
        EVENT_NAME: ${{ github.event_name }}
        EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
        MODEL_INPUT: ${{ inputs.model }}
        SCOUT_INPUT: ${{ inputs.scout }}
        MAX_CHANGED_LINES_INPUT: ${{ inputs.max-changed-lines }}
        MAX_CHANGED_FILES_INPUT: ${{ inputs.max-changed-files }}
        BUDGET_USD_INPUT: ${{ inputs.budget-usd }}
        POST_INPUT: ${{ inputs.post }}
        STEP_SUMMARY_INPUT: ${{ inputs.step-summary }}
      run: |
        # NEVER redirect stderr away in this step: pr-hero's log() writes to
        # process.stderr unconditionally, and GitHub Actions scans BOTH
        # stdout and stderr for workflow commands (::group::, ::warning::,
        # ::error::, ::notice::). $GITHUB_STEP_SUMMARY and $GITHUB_OUTPUT are
        # already present in every step's environment; pr-hero writes to
        # them directly when --ci is set, so nothing here has to plumb them.
        PR_NUM="$PR_NUMBER_INPUT"
        if [ -z "$PR_NUM" ]; then
          if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "pull_request_target" ]; then
            PR_NUM="$EVENT_PR_NUMBER"
          elif [ "$EVENT_NAME" = "issue_comment" ]; then
            PR_NUM="$EVENT_ISSUE_NUMBER"
          fi
        fi
        if [ -z "$PR_NUM" ]; then
          echo "::error::Could not determine the pull request number from the workflow context. Set the 'pr-number' input explicitly."
          exit 1
        fi

        # --ci is unconditional: --budget-usd and --step-summary both
        # require it at parse time, and it is what puts the CLI into
        # headless/assistant-posture mode (never blocks the job on
        # findings). --yes skips the interactive confirmation prompt, which
        # has no TTY to run against here.
        set -- review --pr "$PR_NUM" --ci --yes
        if [ "$POST_INPUT" = "true" ]; then set -- "$@" --post; fi
        if [ "$SCOUT_INPUT" = "true" ]; then set -- "$@" --scout; fi
        if [ "$STEP_SUMMARY_INPUT" = "false" ]; then set -- "$@" --no-step-summary; fi
        if [ -n "$MODEL_INPUT" ]; then set -- "$@" --model "$MODEL_INPUT"; fi
        if [ -n "$MAX_CHANGED_LINES_INPUT" ]; then set -- "$@" --max-changed-lines "$MAX_CHANGED_LINES_INPUT"; fi
        if [ -n "$MAX_CHANGED_FILES_INPUT" ]; then set -- "$@" --max-changed-files "$MAX_CHANGED_FILES_INPUT"; fi
        if [ -n "$BUDGET_USD_INPUT" ]; then set -- "$@" --budget-usd "$BUDGET_USD_INPUT"; fi

        bun "${{ github.action_path }}/bin/pr-hero.js" "$@"
