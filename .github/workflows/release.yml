name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  build-binaries:
    name: Build binaries
    strategy:
      matrix:
        # `native` says whether the runner can EXECUTE what it just built, which
        # is what decides if the smoke below can run. Only darwin-x64 cannot: it
        # is cross-compiled on an arm64 macOS runner, and relying on Rosetta
        # being present would make the gate flaky rather than honest. It ships
        # covered by the three targets that do run, since the defect class this
        # guards — asset resolution inside the virtual filesystem — is
        # architecture-independent.
        include:
          - os: macos-latest
            target: darwin-arm64
            bun_target: bun-darwin-arm64
            native: true
          - os: macos-latest
            target: darwin-x64
            bun_target: bun-darwin-x64
            native: false
          - os: ubuntu-latest
            target: linux-x64
            bun_target: bun-linux-x64
            native: true
          - os: ubuntu-24.04-arm
            target: linux-arm64
            bun_target: bun-linux-arm64
            native: true
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run verification test suite
        run: |
          bun test
          bun run typecheck
          bun run check

      - name: Compile standalone binary
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bun build --compile --target=${{ matrix.bun_target }} --minify --no-compile-autoload-dotenv --no-compile-autoload-bunfig --define __PRHERO_VERSION__="\"${VERSION}\"" src/cli.ts --outfile pr-hero-${{ matrix.target }}

      # Runs THE ARTIFACT ABOUT TO BE UPLOADED, not a rebuild of it: a smoke
      # that compiles its own binary would prove nothing about this one. Placed
      # before the upload on purpose — a binary that cannot resolve its own
      # bundled assets must never reach a release page. That is exactly what
      # v1.0.0 did, and this job was green when it happened.
      - name: Compiled-binary smoke
        if: matrix.native
        run: bun run scripts/compiled-smoke.ts ./pr-hero-${{ matrix.target }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-hero-${{ matrix.target }}
          path: pr-hero-${{ matrix.target }}

  publish-release:
    name: Publish GitHub Release & NPM
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build npm distribution bundle
        run: bun run build

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-binaries
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd release-binaries
          sha256sum pr-hero-* > SHA256SUMS
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-binaries/pr-hero-*
            release-binaries/SHA256SUMS
          generate_release_notes: true

      - name: Publish to NPM
        if: env.NODE_AUTH_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --provenance --access public
