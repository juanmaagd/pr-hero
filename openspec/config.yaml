# openspec/config.yaml
schema: spec-driven

context: |
  Tech stack: TypeScript (strict ESM), Bun runtime (>=1.3.0), SQLite persistent store, Biome (linter & formatter), TTY/TUI terminal workflows
  Architecture: Multi-agent PR review engine with parallel hunter agents, dedupe, adversarial refuters, tier derivation, and CLI/PR workflows
  Testing: bun test (offline unit and integration suites)
  Quality: Biome check (linter/formatter: ./node_modules/.bin/biome check src test), TypeScript tsc --noEmit
  Active changes: pillar2-tui-lifecycle, pillar3-github-actions-ci

strict_tdd: true

testing:
  runner:
    command: "bun test"
    framework: "bun:test"
  layers:
    unit:
      available: true
      tool: "bun:test"
    integration:
      available: true
      tool: "bun:test (offline pipeline, preflight suites, store, CLI)"
    e2e:
      available: true
      tool: "bun run fixture-eval / refuter-probe / martian-cal.ts"
  coverage:
    available: true
    command: "bun test --coverage"
  quality:
    linter:
      available: true
      command: "./node_modules/.bin/biome check src test"
    typecheck:
      available: true
      command: "bun run typecheck"
    formatter:
      available: true
      command: "./node_modules/.bin/biome check src test"

rules:
  proposal:
    - Include rollback plan for risky changes
    - Verify against ROADMAP.md and AGENTS.md constraints
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale and porting context
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns and isolation flags
      - Ensure styles and width are passed as parameters in UI renderers
    tdd: true
    test_command: "bun test"
  verify:
    test_command: "bun test"
    build_command: "bun run typecheck"
    coverage_threshold: 80
  archive:
    - Warn before merging destructive deltas
